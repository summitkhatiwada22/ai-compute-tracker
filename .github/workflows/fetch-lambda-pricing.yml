name: Fetch GPU Pricing (Lambda Cloud)

on:
  schedule:
    # Daily, 5 minutes after the Vast.ai marketplace fetch (06:00 UTC).
    # Even though neocloud rate cards change far less often than a live
    # marketplace, daily still pins down the exact day a price actually
    # moved — the API call is cheap, so there's no real cost to running
    # it daily instead of weekly. The 5-minute offset (not a full hour)
    # keeps both fetches close together in time while still avoiding
    # any risk of the two workflows' commits colliding on the same push.
    - cron: "5 6 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write # needed so the workflow can commit the new CSV back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        env:
          LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
        run: python scripts/fetch_lambda_pricing.py

      - name: Rebuild the database from all raw data collected so far
        run: python scripts/build_database.py

      - name: Commit and push new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/lambda_labs/ data/tracker.duckdb
          git diff --cached --quiet || git commit -m "Daily Lambda Cloud GPU pricing snapshot $(date -u +%F)"
          git push
